<meta name="description" content="Accesso alle mappe CTRN per GPS Garmin, CAD e GIS degli operatori di soccorso e protezione civile.">

<style>
/* TopoRescue (16 nov 2026): pagina d'ingresso. Stessa veste di Carica Mappe ed Estrazione. */
:root {
  --bg: #eef1f3; --fg: #1d2731; --muted: #5b6875; --line: #c9d1d8; --panel: #ffffff;
  --accent: #e2620c; --accent-fg: #ffffff; --accent-soft: #fbe6d6;
  --ok: #2f7d4f; --warn: #b4430b;
  --f-disp: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #141a20; --fg: #e4e9ee; --muted: #93a1ad; --line: #2e3842; --panel: #1c242c;
  --accent: #f07a2a; --accent-fg: #1a0e05; --accent-soft: #3a2414; --ok: #5fbf86; --warn: #ff9a5c; color-scheme: dark } }
* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px }
[hidden] { display: none !important }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 6px }
h1 { font: 700 2.1rem/1.05 var(--f-disp); margin: 0; letter-spacing: .01em }
h1 span { color: var(--accent) }
.sub { color: var(--muted); font-size: .92rem; margin: 2px 0 0 }
h2 { font: 600 .82rem/1 var(--f-disp); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 12px }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 12px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); min-width: 0 }
input[type=text], input[type=email], input[type=password], select { font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 10px; width: 100%; min-width: 0 }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin-top: 1px }
.btn { display: block; width: 100%; text-align: center; font: 700 1.1rem/1 var(--f-disp); letter-spacing: .02em; padding: 15px 12px; border-radius: 9px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; text-decoration: none }
.btn.sec { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 600; font-size: 1rem; padding: 12px }
.btn:disabled { opacity: .45; cursor: default }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px }
.links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .92rem }
.msg { border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); padding: 9px 11px; border-radius: 4px; font-size: .93rem; margin: 0 }
.msg.err { border-color: var(--warn); background: var(--accent-soft) }
.scelta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.scelta a, .scelta button { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); color: var(--fg); text-decoration: none; cursor: pointer; font: inherit; text-align: left; min-width: 0 }
.scelta a:hover, .scelta button:hover, .scelta [aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft) }
.scelta b { font: 700 1.15rem/1.1 var(--f-disp) }
.scelta small { color: var(--muted); font-size: .85rem }
.ciao { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.ciao b { font: 700 1.3rem/1.1 var(--f-disp) }
.badge { font: 600 .72rem/1 var(--f-disp); text-transform: uppercase; letter-spacing: .08em; padding: 5px 7px; border-radius: 5px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.badge.ok { border-color: var(--ok); color: var(--ok) }
ol.ist { margin: 0; padding-left: 20px; font-size: .93rem } ol.ist li + li { margin-top: 5px }
.piede { color: var(--muted); font-size: .82rem; text-align: center; display: flex; flex-direction: column; gap: 4px }
.piede a { color: var(--muted) }
select.lingua { width: auto; padding: 6px 8px; font-size: .9rem }
code { font: .88em var(--f-mono) }
@media (max-width: 420px) { .grid2, .scelta { grid-template-columns: 1fr } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Topo<span>Rescue</span></h1><p class="sub" data-t="sottotitolo"></p></div>
  <select class="lingua" id="lingua" aria-label="Lingua"></select>
</header>

<p class="msg" id="msg" role="status" hidden></p>

<!-- ============ ACCESSO ============ -->
<section id="v-login" hidden>
  <h2 data-t="accedi"></h2>
  <form class="stack" id="f-login">
    <label class="f"><span data-t="email"></span><input type="email" id="l-email" autocomplete="username" required></label>
    <label class="f"><span data-t="password"></span><input type="password" id="l-pw" autocomplete="current-password" required></label>
    <button class="btn" type="submit" data-t="entra"></button>
    <div class="links"><button type="button" class="link" data-vai="registra" data-t="nuovo"></button>
      <button type="button" class="link" data-vai="recupero" data-t="dimenticata"></button></div>
    <button type="button" class="link" id="b-rimanda" hidden data-t="rimanda"></button>
  </form>
</section>

<!-- ============ REGISTRAZIONE ============ -->
<section id="v-registra" hidden>
  <h2 data-t="registrati"></h2>
  <form class="stack" id="f-reg">
    <div class="grid2">
      <label class="f"><span data-t="nome"></span><input type="text" id="r-nome" autocomplete="given-name" required></label>
      <label class="f"><span data-t="cognome"></span><input type="text" id="r-cognome" autocomplete="family-name" required></label>
    </div>
    <label class="f"><span data-t="email"></span><input type="email" id="r-email" autocomplete="email" required></label>
    <div class="grid2">
      <label class="f"><span data-t="password8"></span><input type="password" id="r-pw" autocomplete="new-password" minlength="8" required></label>
      <label class="f"><span data-t="ripeti"></span><input type="password" id="r-pw2" autocomplete="new-password" minlength="8" required></label>
    </div>
    <label class="f"><span data-t="ente"></span><select id="r-ente" required></select></label>
    <label class="f"><span data-t="gruppo"></span><input type="text" id="r-gruppo" autocomplete="organization"></label>
    <label class="check"><input type="checkbox" id="r-consenso" required><span data-t="consenso"></span></label>
    <button class="btn" type="submit" data-t="crea"></button>
    <div class="links"><button type="button" class="link" data-vai="login" data-t="hogia"></button></div>
  </form>
</section>

<!-- ============ PASSWORD DIMENTICATA / NUOVA ============ -->
<section id="v-recupero" hidden>
  <h2 data-t="recupera"></h2>
  <form class="stack" id="f-rec">
    <p class="sub" data-t="recupera_testo"></p>
    <label class="f"><span data-t="email"></span><input type="email" id="p-email" autocomplete="email" required></label>
    <button class="btn" type="submit" data-t="invia"></button>
    <div class="links"><button type="button" class="link" data-vai="login" data-t="torna"></button></div>
  </form>
</section>
<section id="v-nuovapw" hidden>
  <h2 data-t="nuovapw"></h2>
  <form class="stack" id="f-npw">
    <label class="f"><span data-t="password8"></span><input type="password" id="n-pw" autocomplete="new-password" minlength="8" required></label>
    <label class="f"><span data-t="ripeti"></span><input type="password" id="n-pw2" autocomplete="new-password" minlength="8" required></label>
    <button class="btn" type="submit" data-t="salva"></button>
  </form>
</section>

<!-- ============ DOPO IL LOGIN ============ -->
<div id="v-menu" class="stack" hidden>
  <section class="ciao"><div><span class="sub" data-t="benvenuto"></span><br><b id="m-nome"></b></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="badge" id="m-badge"></span>
    <button class="link" id="b-esci" data-t="esci"></button></div></section>

  <section>
    <h2 data-t="sez_web"></h2>
    <div class="scelta">
      <a href="https://claudemonbaron.github.io/Carica_Mappe/"><b data-t="carica"></b><small data-t="carica_d"></small></a>
      <a href="https://claudemonbaron.github.io/Carica_Mappe/estrazione/"><b data-t="estrai"></b><small data-t="estrai_d"></small></a>
    </div>
  </section>

  <section class="stack">
    <h2 style="margin:0" data-t="sez_app"></h2>
    <div class="scelta" id="so">
      <button type="button" data-so="mac" aria-pressed="false"><b>Mac</b><small data-t="mac_d"></small></button>
      <button type="button" data-so="win" aria-pressed="false"><b>Windows</b><small data-t="win_d"></small></button>
    </div>
    <label class="check"><input type="checkbox" id="a-estr" checked><span data-t="app_estr"></span></label>
    <label class="check"><input type="checkbox" id="a-car" checked><span data-t="app_car"></span></label>
    <button class="btn" id="b-scarica" disabled data-t="scarica_app"></button>
    <div id="ist-mac" hidden><ol class="ist" data-t="ist_mac"></ol></div>
    <div id="ist-win" hidden><ol class="ist" data-t="ist_win"></ol></div>
  </section>

  <section class="stack">
    <h2 style="margin:0" data-t="sez_locale"></h2>
    <div id="loc-si" class="stack" hidden>
      <p style="margin:0" data-t="loc_si"></p>
      <p class="msg err" style="margin:0" data-t="loc_spazio"></p>
      <a class="btn sec" id="b-drive" target="_blank" rel="noopener" data-t="loc_drive"></a>
    </div>
    <div id="loc-no" class="stack" hidden>
      <p style="margin:0" data-t="loc_no"></p>
      <a class="btn sec" id="b-richiedi" data-t="richiedi"></a>
    </div>
  </section>

  <section>
    <h2 data-t="sez_istr"></h2>
    <div class="scelta">
      <a data-pdf="https://claudemonbaron.github.io/Carica_Mappe/istruzioni" target="_blank" rel="noopener"><b data-t="carica"></b><small>PDF</small></a>
      <a data-pdf="https://claudemonbaron.github.io/Carica_Mappe/estrazione/istruzioni" target="_blank" rel="noopener"><b data-t="estrai"></b><small>PDF</small></a>
    </div>
  </section>
</div>

<p class="sub" id="v-attesa" style="text-align:center" data-t="attendi"></p>

<footer class="piede">
  <span><a href="privacy.html" data-t="privacy"></a> · <a href="mailto:toporescue@gmail.com">toporescue@gmail.com</a></span>
  <span data-t="gratis"></span>
</footer>
</div>

const IDX = k => Math.max(0, LINGUE.findIndex(x => x[0] === k));
let LINGUA = (() => { try { const v = localStorage.getItem("lingua_mappe"); if (v && IDX(v) >= 0 && LINGUE.some(x => x[0] === v)) return v; } catch (e) {}
  const n = (navigator.language || "it").slice(0, 2); return LINGUE.some(x => x[0] === n) ? n : "it"; })();
const t = k => { const r = T[k]; return r ? (r[IDX(LINGUA)] || r[0]) : k; };
function traduci() {
  document.documentElement.lang = LINGUA;
  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = t(e.dataset.t); });
  document.querySelectorAll("[data-pdf]").forEach(e => { e.href = e.dataset.pdf + "_" + LINGUA + ".pdf"; });
  const s = $("r-ente"), v = s.value;
  s.innerHTML = '<option value="" disabled selected>–</option>' + ENTI.map(k => '<option value="' + k + '">' + t("e_" + k) + "</option>").join("");
  if (v) s.value = v;
  aggiornaBadge();
}

// ---------------------------------------------------------------- supporto
const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const QUI = location.origin + location.pathname;
let STATO = null, RECUPERO = /type=recovery/.test(location.hash);   // link "password dimenticata" della mail

function mostra(v) {
  ["login", "registra", "recupero", "nuovapw", "menu", "attesa"].forEach(x => { $("v-" + x).hidden = x !== v; });
  if (v !== "menu") window.scrollTo(0, 0);
}
function avvisa(testo, errore) { const m = $("msg"); m.textContent = testo || ""; m.hidden = !testo; m.classList.toggle("err", !!errore); }
function errore(e) {
  const s = String((e && (e.message || e.error_description)) || e || "");
  if (/invalid login credentials/i.test(s)) return t("m_credenziali");
  if (/email not confirmed/i.test(s)) return t("m_non_confermata");
  if (/link is invalid|has expired|otp_expired|token has expired/i.test(s)) return t("m_scaduto");
  if (/rate limit|too many|429/i.test(s)) return t("m_troppe");
  return t("m_errore") + s;
}
async function occupato(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { avvisa(errore(e), true); } finally { btn.disabled = false; }
}
function sistema() {
  const u = navigator.userAgent;
  return (/Windows/.test(u) ? "Windows" : /iPhone|iPad/.test(u) ? "iOS" : /Mac/.test(u) ? "Mac" : /Android/.test(u) ? "Android" : /Linux/.test(u) ? "Linux" : "altro") + " / browser";
}

// ---------------------------------------------------------------- dopo il login
async function entrato(sessione) {
  mostra("attesa");
  const { data, error } = await sb.rpc("mio_stato");
  if (error) { avvisa(errore(error), true); mostra("login"); return; }
  STATO = (data && data[0]) || { autorizzato: false, bloccato: false, nome: "" };
  if (STATO.bloccato) { await sb.auth.signOut(); avvisa(t("m_bloccato"), true); mostra("login"); return; }
  try { await sb.from("accessi").insert({ app: "ingresso", versione: VERSIONE, sistema: sistema() }); } catch (e) {}
  const u = sessione.user, md = u.user_metadata || {};
  $("m-nome").textContent = [STATO.nome || md.nome, md.cognome].filter(Boolean).join(" ") || u.email;
  $("loc-si").hidden = !STATO.autorizzato; $("loc-no").hidden = !!STATO.autorizzato;
  $("b-drive").href = "https://drive.google.com/drive/folders/" + RADICE;
  const corpo = "Nome: " + (md.nome || "") + "\nCognome: " + (md.cognome || "") + "\nEmail: " + u.email +
    "\nEnte: " + t("e_" + (md.ente_tipo || "privato")) + "\nGruppo / sezione: " + (md.ente_nome || "") +
    "\n\nReferente del gruppo (nome e telefono o email):\n\nMotivo della richiesta:\n";
  $("b-richiedi").href = "mailto:" + MAIL + "?subject=" + encodeURIComponent("Richiesta abilitazione copia locale – " + u.email) + "&body=" + encodeURIComponent(corpo);
  aggiornaBadge();
  const so = /Windows/.test(navigator.userAgent) ? "win" : /Mac/.test(navigator.userAgent) ? "mac" : null;
  if (so) scegliSO(so);
  mostra("menu");
}
function aggiornaBadge() {
  const b = $("m-badge"); if (!b || !STATO) return;
  b.textContent = STATO.autorizzato ? t("abilitato") : t("base"); b.classList.toggle("ok", !!STATO.autorizzato);
}

// ---------------------------------------------------------------- programmi dal Drive
let SO = null;
function scegliSO(s) {
  SO = s;
  document.querySelectorAll("#so [data-so]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.so === s)));
  $("ist-mac").hidden = s !== "mac"; $("ist-win").hidden = s !== "win";
  $("b-scarica").disabled = false;
}
async function elencoDrive(id) {
  const q = new URLSearchParams({ q: "'" + id + "' in parents and trashed=false", pageSize: "1000", key: CHIAVE_API,
    fields: "files(id,name,size)", supportsAllDrives: "true", includeItemsFromAllDrives: "true" });
  const r = await fetch("https://www.googleapis.com/drive/v3/files?" + q, { cache: "no-store" });
  if (!r.ok) throw new Error("Drive " + r.status);
  return (await r.json()).files || [];
}
async function scaricaApp() {
  const est = SO === "mac" ? ".dmg" : ".exe";
  const voluti = [$("a-estr").checked && APP.estr, $("a-car").checked && APP.car].filter(Boolean).map(n => n + est);
  if (!voluti.length) return;
  let cart;
  try { cart = (await elencoDrive(RADICE)).find(f => f.name === "Estrazione_mappe"); if (!cart) throw new Error("Estrazione_mappe"); }
  catch (e) { avvisa(t("m_drive") + e.message, true); return; }
  const files = await elencoDrive(cart.id);
  let n = 0;
  for (const nome of voluti) {
    const f = files.find(x => x.name === nome);
    if (!f) continue;
    const a = document.createElement("a");            // download diretto dal Drive, col nome del file
    a.href = "https://drive.usercontent.google.com/download?id=" + f.id + "&export=download&confirm=t";
    a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); n++;
    await new Promise(ok => setTimeout(ok, 1500));    // i browser bloccano due download nello stesso istante
  }
  try { await sb.from("accessi").insert({ app: "scarica_" + SO, versione: VERSIONE, sistema: sistema() }); } catch (e) {}
  avvisa(n ? t("m_scarico") : t("m_drive") + voluti.join(", "), !n);
}

// ---------------------------------------------------------------- moduli
document.querySelectorAll("[data-vai]").forEach(b => b.addEventListener("click", () => { avvisa(""); mostra(b.dataset.vai); }));
document.querySelectorAll("#so [data-so]").forEach(b => b.addEventListener("click", () => scegliSO(b.dataset.so)));
$("b-scarica").addEventListener("click", e => occupato(e.currentTarget, scaricaApp));

$("f-login").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    $("b-rimanda").hidden = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pw").value });
    if (error) { if (/not confirmed/i.test(error.message)) $("b-rimanda").hidden = false; throw error; }
    avvisa(""); $("l-pw").value = ""; await entrato(data.session);
  }); });
$("b-rimanda").addEventListener("click", e => occupato(e.currentTarget, async () => {
  const { error } = await sb.auth.resend({ type: "signup", email: $("l-email").value.trim(), options: { emailRedirectTo: QUI } });
  if (error) throw error; avvisa(t("m_rimandata"));
}));

$("f-reg").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    if ($("r-pw").value !== $("r-pw2").value) { avvisa(t("m_pw_diverse"), true); return; }
    const email = $("r-email").value.trim();
    const { error } = await sb.auth.signUp({ email, password: $("r-pw").value, options: { emailRedirectTo: QUI,
      data: { nome: $("r-nome").value.trim(), cognome: $("r-cognome").value.trim(), ente_tipo: $("r-ente").value,
              ente_nome: $("r-gruppo").value.trim(), consenso: $("r-consenso").checked ? "si" : "no", lingua: LINGUA } } });
    if (error) throw error;
    $("f-reg").reset(); $("l-email").value = email; mostra("login"); avvisa(t("m_reg_ok"));
  }); });

$("f-rec").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    const { error } = await sb.auth.resetPasswordForEmail($("p-email").value.trim(), { redirectTo: QUI });
    if (error) throw error; mostra("login"); avvisa(t("m_rec_ok"));
  }); });

$("f-npw").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    if ($("n-pw").value !== $("n-pw2").value) { avvisa(t("m_pw_diverse"), true); return; }
    const { error } = await sb.auth.updateUser({ password: $("n-pw").value });
    if (error) throw error;
    RECUPERO = false; $("f-npw").reset(); avvisa(t("m_npw_ok"));
    const { data } = await sb.auth.getSession(); if (data.session) await entrato(data.session); else mostra("login");
  }); });

$("b-esci").addEventListener("click", async () => { await sb.auth.signOut(); STATO = null; avvisa(""); mostra("login"); });

// ---------------------------------------------------------------- avvio
(function lingua() {
  const s = $("lingua");
  s.innerHTML = LINGUE.map(([k, n]) => '<option value="' + k + '">' + n + "</option>").join("");
  s.value = LINGUA;
  s.addEventListener("change", () => { LINGUA = s.value; try { localStorage.setItem("lingua_mappe", LINGUA); } catch (e) {} traduci(); });
})();
traduci();
// errore nel link della mail (scaduto o gia' usato): Supabase lo mette nell'indirizzo
(function erroreLink() {
  const h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (h.get("error_description")) { avvisa(errore(h.get("error_description").replace(/\+/g, " ")) + " " + t("m_link"), true); history.replaceState(null, "", QUI); }
})();
sb.auth.onAuthStateChange((evento, sessione) => {
  if (evento === "PASSWORD_RECOVERY") { RECUPERO = true; mostra("nuovapw"); }
});
// Link delle mail con ?token_hash=...&type=email|recovery (modelli delle mail di Supabase): la verifica la fa la
// pagina aperta da una persona. I controlli automatici dei servizi di posta, che aprono il link per vedere se e'
// pericoloso, scaricano solo la pagina e non consumano il link (col link diretto di Supabase si', "link scaduto").
async function verificaLink() {
  const q = new URLSearchParams(location.search);
  const th = q.get("token_hash"), tipo = q.get("type");
  if (!th || !tipo) return false;
  history.replaceState(null, "", QUI);
  const { data, error } = await sb.auth.verifyOtp({ token_hash: th, type: tipo });
  if (error) { avvisa(errore(error) + " " + t("m_link"), true); mostra("login"); return true; }
  if (tipo === "recovery") { RECUPERO = true; mostra("nuovapw"); return true; }
  if (data.session) await entrato(data.session); else mostra("login");
  return true;
}
verificaLink().then(fatto => {
  if (fatto) return;
  sb.auth.getSession().then(({ data }) => {
    if (RECUPERO) { mostra("nuovapw"); return; }
    if (data.session) entrato(data.session); else mostra("login");
  });
}).catch(e => { avvisa(errore(e), true); mostra("login"); });
</script>
