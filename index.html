<style>
/* TopoRescue (16 nov 2026): pagina d'ingresso. Stessa veste di Carica Mappe ed Estrazione. */
:root {
  --bg: #eef1f3; --fg: #1d2731; --muted: #5b6875; --line: #c9d1d8; --panel: #ffffff;
  --accent: #e2620c; --accent-fg: #ffffff; --accent-soft: #fbe6d6;
  --ok: #2f7d4f; --warn: #b4430b;
  --f-disp: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #141a20; --fg: #e4e9ee; --muted: #93a1ad; --line: #2e3842; --panel: #1c242c;
  --accent: #f07a2a; --accent-fg: #1a0e05; --accent-soft: #3a2414; --ok: #5fbf86; --warn: #ff9a5c; color-scheme: dark } }
* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px }
[hidden] { display: none !important }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 6px }
h1 { font: 700 2.1rem/1.05 var(--f-disp); margin: 0; letter-spacing: .01em }
h1 span { color: var(--accent) }
.sub { color: var(--muted); font-size: .92rem; margin: 2px 0 0 }
h2 { font: 600 .82rem/1 var(--f-disp); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 12px }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 12px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); min-width: 0 }
input[type=text], input[type=email], input[type=password], select { font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 10px; width: 100%; min-width: 0 }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin-top: 1px }
.btn { display: block; width: 100%; text-align: center; font: 700 1.1rem/1 var(--f-disp); letter-spacing: .02em; padding: 15px 12px; border-radius: 9px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; text-decoration: none }
.btn.sec { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 600; font-size: 1rem; padding: 12px }
.btn:disabled { opacity: .45; cursor: default }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px }
.links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .92rem }
.msg { border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); padding: 9px 11px; border-radius: 4px; font-size: .93rem; margin: 0 }
.msg.err { border-color: var(--warn); background: var(--accent-soft) }
.scelta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.scelta.tre { grid-template-columns: 1fr 1fr 1fr }
.nota { margin: 0; color: var(--muted); font-size: .85rem }
.scelta a, .scelta button { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); color: var(--fg); text-decoration: none; cursor: pointer; font: inherit; text-align: left; min-width: 0 }
.scelta a:hover, .scelta button:hover, .scelta [aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft) }
.scelta b { font: 700 1.15rem/1.1 var(--f-disp) }
.scelta small { color: var(--muted); font-size: .85rem }
.ciao { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.ciao b { font: 700 1.3rem/1.1 var(--f-disp) }
.badge { font: 600 .72rem/1 var(--f-disp); text-transform: uppercase; letter-spacing: .08em; padding: 5px 7px; border-radius: 5px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.badge.ok { border-color: var(--ok); color: var(--ok) }
ol.ist { margin: 0; padding-left: 20px; font-size: .93rem } ol.ist li + li { margin-top: 5px }
.piede { color: var(--muted); font-size: .82rem; text-align: center; display: flex; flex-direction: column; gap: 4px }
.piede a { color: var(--muted) }
select.lingua { width: auto; padding: 6px 8px; font-size: .9rem }
code { font: .88em var(--f-mono) }
@media (max-width: 420px) { .grid2, .scelta, .scelta.tre { grid-template-columns: 1fr } }
img.logo { width: 64px; height: 64px; flex: none }
/* 17 nov: logo TopoRescue in filigrana sullo sfondo (fisso, tenue); riquadri appena trasparenti */
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .06;
  background: url("toporescue_filigrana.png") center 55% / min(72vmin, 620px) no-repeat }
section { background: color-mix(in srgb, var(--panel) 90%, transparent) }
/* 17 nov: schermi larghi -> dopo il login due colonne (pagine web + istruzioni | programmi + mappe sul computer);
   i moduli di accesso restano stretti e centrati */
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
@media (min-width: 1000px) {
  .wrap { max-width: 1180px }
  #v-login, #v-registra, #v-recupero, #v-nuovapw, #v-dichiarazione, #msg, #v-attesa { width: 100%; max-width: 560px; align-self: center }
  #v-menu:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start }
  #v-menu > .ciao { grid-column: 1 / -1 }
}
</style>

<!-- 17 nov: schermata d'apertura TopoRescue (5 s, una volta per sessione, un clic la chiude) -->
<div id="apertura" onclick="this.remove()" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);transition:opacity .6s;cursor:pointer">
  <img src="toporescue_apertura.png" alt="TopoRescue Maps - by Claude Monbaron, A.N.A. PN e P.C. RFVG" style="width:min(380px,80vw);height:auto">
</div>
<script>(function () { var a = document.getElementById("apertura");
  try { if (sessionStorage.getItem("apertura_toporescue")) { a.remove(); return; } sessionStorage.setItem("apertura_toporescue", "1"); } catch (e) {}
  setTimeout(function () { a.style.opacity = "0"; setTimeout(function () { a.remove(); }, 700); }, 5000); })();</script>

<div class="wrap">
<header>
  <div style="display:flex;align-items:center;gap:14px"><img class="logo" src="toporescue_marchio.svg" alt="TopoRescue Maps" width="64" height="64"><div><h1>Topo<span>Rescue</span></h1><p class="sub" data-t="sottotitolo"></p></div></div>
  <select class="lingua" id="lingua" aria-label="Lingua"></select>
</header>

<p class="msg" id="msg" role="status" hidden></p>

<!-- ============ ACCESSO ============ -->
<section id="v-login" hidden>
  <h2 data-t="accedi"></h2>
  <form class="stack" id="f-login">
    <label class="f"><span data-t="email"></span><input type="email" id="l-email" autocomplete="username" required></label>
    <label class="f"><span data-t="password"></span><input type="password" id="l-pw" autocomplete="current-password" required></label>
    <button class="btn" type="submit" data-t="entra"></button>
    <div class="links"><button type="button" class="link" data-vai="registra" data-t="nuovo"></button>
      <button type="button" class="link" data-vai="recupero" data-t="dimenticata"></button></div>
    <button type="button" class="link" id="b-rimanda" hidden data-t="rimanda"></button>
  </form>
</section>

<!-- ============ REGISTRAZIONE ============ -->
<section id="v-registra" hidden>
  <h2 data-t="registrati"></h2>
  <form class="stack" id="f-reg">
    <div class="grid2">
      <label class="f"><span data-t="nome"></span><input type="text" id="r-nome" autocomplete="given-name" required></label>
      <label class="f"><span data-t="cognome"></span><input type="text" id="r-cognome" autocomplete="family-name" required></label>
    </div>
    <label class="f"><span data-t="email"></span><input type="email" id="r-email" autocomplete="email" required></label>
    <div class="grid2">
      <label class="f"><span data-t="password8"></span><input type="password" id="r-pw" autocomplete="new-password" minlength="8" required></label>
      <label class="f"><span data-t="ripeti"></span><input type="password" id="r-pw2" autocomplete="new-password" minlength="8" required></label>
    </div>
    <label class="f"><span data-t="ente"></span><select id="r-ente" required></select></label>
    <label class="f"><span data-t="gruppo"></span><input type="text" id="r-gruppo" autocomplete="organization"></label>
    <label class="check"><input type="checkbox" id="r-consenso" required><span data-t="consenso"></span></label>
    <button class="btn" type="submit" data-t="crea"></button>
    <div class="links"><button type="button" class="link" data-vai="login" data-t="hogia"></button></div>
  </form>
</section>

<!-- ============ PASSWORD DIMENTICATA / NUOVA ============ -->
<section id="v-recupero" hidden>
  <h2 data-t="recupera"></h2>
  <form class="stack" id="f-rec">
    <p class="sub" data-t="recupera_testo"></p>
    <label class="f"><span data-t="email"></span><input type="email" id="p-email" autocomplete="email" required></label>
    <button class="btn" type="submit" data-t="invia"></button>
    <div class="links"><button type="button" class="link" data-vai="login" data-t="torna"></button></div>
  </form>
</section>
<section id="v-nuovapw" hidden>
  <h2 data-t="nuovapw"></h2>
  <form class="stack" id="f-npw">
    <label class="f"><span data-t="password8"></span><input type="password" id="n-pw" autocomplete="new-password" minlength="8" required></label>
    <label class="f"><span data-t="ripeti"></span><input type="password" id="n-pw2" autocomplete="new-password" minlength="8" required></label>
    <button class="btn" type="submit" data-t="salva"></button>
  </form>
</section>

<!-- ============ DOPO IL LOGIN ============ -->

  <button class="link" id="b-dich-esci" data-t="esci"></button>
</section>

<div id="v-menu" class="stack" hidden>
  <section class="ciao"><div><span class="sub" data-t="benvenuto"></span><br><b id="m-nome"></b></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="badge" id="m-badge"></span>
    <button class="link" id="b-esci" data-t="esci"></button></div></section>

  <div class="col">
  <section>
    <h2 data-t="sez_web"></h2>

      <a href="https://claudemonbaron.github.io/Carica_Mappe/"><b data-t="carica"></b><small data-t="carica_d"></small></a>

    </div>
  </section>

  <section>

      <a data-pdf="https://claudemonbaron.github.io/Carica_Mappe/istruzioni" target="_blank" rel="noopener"><b data-t="carica"></b><small>PDF</small></a>
      <a data-pdf="https://claudemonbaron.github.io/Carica_Mappe/estrazione/istruzioni" target="_blank" rel="noopener"><b data-t="estrai"></b><small>PDF</small></a>
    </div>
  </section>
  </div>
  <div class="col">
  <section class="stack">
    <h2 style="margin:0" data-t="sez_app"></h2>

      <button type="button" data-so="mac" aria-pressed="false"><b>Mac</b><small data-t="mac_d"></small></button>

    <div id="ist-mac" hidden><ol class="ist" data-t="ist_mac"></ol></div>
    <div id="ist-win" hidden><ol class="ist" data-t="ist_win"></ol></div>
  </section>

  <section class="stack">
    <h2 style="margin:0" data-t="sez_locale"></h2>

      <p style="margin:0" data-t="loc_si"></p>

    <div id="loc-no" class="stack" hidden>
      <p style="margin:0" data-t="loc_no"></p>
      <a class="btn sec" id="b-richiedi" data-t="richiedi"></a>
    </div>
  </section>
  </div>
</div>

 ist_mac: ["<li>Apri il file <code>.dmg</code> scaricato e trascina il programma sulla Scrivania o in Applicazioni, poi espelli il dmg.</li><li>La prima volta aprilo con clic destro › <b>Apri</b>: il programma non è firmato da Apple.</li><li>Al primo avvio accedi con la stessa email e password di questa pagina. Gli aggiornamenti li propone il programma da solo.</li>",
           "<li>Open the downloaded <code>.dmg</code> and drag the program to the Desktop or Applications, then eject the dmg.</li><li>The first time, open it with right-click › <b>Open</b>: the program is not signed by Apple.</li><li>At first start sign in with the same email and password as this page. Updates are offered by the program itself.</li>",
           "<li>Ouvrir le <code>.dmg</code> téléchargé et glisser le programme sur le Bureau ou dans Applications, puis éjecter le dmg.</li><li>La première fois, l'ouvrir avec clic droit › <b>Ouvrir</b> : le programme n'est pas signé par Apple.</li><li>Au premier lancement, se connecter avec le même e-mail et mot de passe que cette page. Les mises à jour sont proposées par le programme.</li>",
           "<li>Die heruntergeladene <code>.dmg</code> öffnen und das Programm auf den Schreibtisch oder in Programme ziehen, dann die dmg auswerfen.</li><li>Beim ersten Mal mit Rechtsklick › <b>Öffnen</b> starten: das Programm ist nicht von Apple signiert.</li><li>Beim ersten Start mit derselben E-Mail und demselben Passwort wie auf dieser Seite anmelden. Updates bietet das Programm selbst an.</li>",
           "<li>Abre el <code>.dmg</code> descargado y arrastra el programa al Escritorio o a Aplicaciones, luego expulsa el dmg.</li><li>La primera vez ábrelo con clic derecho › <b>Abrir</b>: el programa no está firmado por Apple.</li><li>En el primer arranque accede con el mismo correo y contraseña de esta página. Las actualizaciones las propone el programa.</li>"],
 ist_win: ["<li>Copia il file <code>.exe</code> scaricato dove vuoi (per esempio sul Desktop) e aprilo con doppio clic: non serve installarlo.</li><li>Se compare l'avviso di Windows SmartScreen: <b>Ulteriori informazioni › Esegui comunque</b>.</li><li>Al primo avvio accedi con la stessa email e password di questa pagina. Gli aggiornamenti li propone il programma da solo.</li>",
           "<li>Copy the downloaded <code>.exe</code> wherever you like (e.g. the Desktop) and double-click it: no installation needed.</li><li>If Windows SmartScreen appears: <b>More info › Run anyway</b>.</li><li>At first start sign in with the same email and password as this page. Updates are offered by the program itself.</li>",
           "<li>Copier le <code>.exe</code> téléchargé où vous voulez (par exemple sur le Bureau) et l'ouvrir par double-clic : pas d'installation.</li><li>Si Windows SmartScreen apparaît : <b>Informations complémentaires › Exécuter quand même</b>.</li><li>Au premier lancement, se connecter avec le même e-mail et mot de passe que cette page. Les mises à jour sont proposées par le programme.</li>",
           "<li>Die heruntergeladene <code>.exe</code> an einen beliebigen Ort kopieren (z. B. Desktop) und doppelklicken: keine Installation nötig.</li><li>Erscheint Windows SmartScreen: <b>Weitere Informationen › Trotzdem ausführen</b>.</li><li>Beim ersten Start mit derselben E-Mail und demselben Passwort wie auf dieser Seite anmelden. Updates bietet das Programm selbst an.</li>",
           "<li>Copia el <code>.exe</code> descargado donde quieras (por ejemplo en el Escritorio) y ábrelo con doble clic: no hace falta instalarlo.</li><li>Si aparece Windows SmartScreen: <b>Más información › Ejecutar de todas formas</b>.</li><li>En el primer arranque accede con el mismo correo y contraseña de esta página. Las actualizaciones las propone el programa.</li>"],

 dich_t: ["Dichiarazione di responsabilità", "Disclaimer", "Décharge de responsabilité", "Haftungsausschluss", "Exención de responsabilidad"],
 dich_testo: ["Prima di usare le mappe leggi e accetta la dichiarazione di responsabilità (una volta sola). In breve: le mappe sono una semplificazione delle carte tecniche e delle banche dati ufficiali (Regioni, Stati confinanti, ISTAT, OpenStreetMap), con dati dal 1979 al 2025; possono contenere inesattezze o non essere aggiornate. Sono messe a disposizione gratuitamente agli operatori della protezione civile; l'autore declina ogni responsabilità per inesattezze e per un uso improprio. Alcuni dati (Abruzzo, CC BY-NC) non possono essere usati a scopo commerciale. Fonti e licenze complete nel PDF.",
   "Before using the maps, read and accept the disclaimer (only once). In short: the maps are a simplification of official technical maps and databases (Regions, neighbouring countries, ISTAT, OpenStreetMap), with data from 1979 to 2025; they may contain errors or be out of date. They are provided free of charge to civil protection operators; the author accepts no liability for errors or improper use. Some data (Abruzzo, CC BY-NC) may not be used commercially. Full sources and licences in the PDF.",
   "Avant d'utiliser les cartes, lisez et acceptez la décharge de responsabilité (une seule fois). En bref : les cartes sont une simplification des cartes techniques et bases de données officielles (Régions, pays voisins, ISTAT, OpenStreetMap), avec des données de 1979 à 2025 ; elles peuvent contenir des erreurs ou ne pas être à jour. Elles sont mises gratuitement à disposition des opérateurs de la protection civile ; l'auteur décline toute responsabilité pour les erreurs et un usage impropre. Certaines données (Abruzzes, CC BY-NC) ne peuvent pas être utilisées à des fins commerciales. Sources et licences complètes dans le PDF.",
   "Bevor Sie die Karten verwenden, lesen und akzeptieren Sie den Haftungsausschluss (nur einmal). Kurz: die Karten sind eine Vereinfachung amtlicher technischer Karten und Datenbanken (Regionen, Nachbarländer, ISTAT, OpenStreetMap) mit Daten von 1979 bis 2025; sie können Fehler enthalten oder veraltet sein. Sie werden Einsatzkräften des Zivilschutzes kostenlos zur Verfügung gestellt; der Autor haftet nicht für Fehler oder unsachgemäße Nutzung. Einige Daten (Abruzzen, CC BY-NC) dürfen nicht kommerziell genutzt werden. Vollständige Quellen und Lizenzen im PDF.",
   "Antes de usar los mapas, lee y acepta la exención de responsabilidad (una sola vez). En resumen: los mapas son una simplificación de la cartografía técnica y las bases de datos oficiales (Regiones, países limítrofes, ISTAT, OpenStreetMap), con datos de 1979 a 2025; pueden contener errores o no estar actualizados. Se ponen a disposición gratuitamente de los operadores de protección civil; el autor declina toda responsabilidad por errores y por un uso indebido. Algunos datos (Abruzos, CC BY-NC) no pueden usarse con fines comerciales. Fuentes y licencias completas en el PDF."],

 loc_si: ["Il tuo account è abilitato alla copia locale. Il modo più semplice: nei programmi Estrarre Mappe e Carica Mappe premi «Mappe sul computer...», scegli paese, regione o provincia (le confinanti si aggiungono da sole) e la copia si scarica da sola; poi i programmi lavorano senza internet e controllano gli aggiornamenti.",
            "Your account is authorised for the local copy. The easiest way: in the Estrarre Mappe and Carica Mappe programs press «Mappe sul computer...» (Maps on this computer), choose a country, region or province (neighbours are added automatically) and the copy downloads by itself; the programs then work without internet and check for updates.",
            "Votre compte est habilité à la copie locale. Le plus simple : dans les programmes Estrarre Mappe et Carica Mappe, appuyez sur «Mappe sul computer...» (Cartes sur l'ordinateur), choisissez un pays, une région ou une province (les voisines s'ajoutent toutes seules) et la copie se télécharge d'elle-même ; ensuite les programmes fonctionnent sans internet et vérifient les mises à jour.",
            "Ihr Konto ist für die lokale Kopie freigegeben. Am einfachsten: in den Programmen Estrarre Mappe und Carica Mappe auf «Mappe sul computer...» (Karten auf dem Computer) drücken, Land, Region oder Provinz wählen (Nachbarn kommen von selbst dazu), und die Kopie lädt sich selbst; danach arbeiten die Programme ohne Internet und prüfen Updates.",
            "Tu cuenta está habilitada para la copia local. Lo más sencillo: en los programas Estrarre Mappe y Carica Mappe pulsa «Mappe sul computer...» (Mapas en el ordenador), elige país, región o provincia (las limítrofes se añaden solas) y la copia se descarga sola; después los programas funcionan sin internet y comprueban las actualizaciones."],
 loc_passi: [
  "<li>Apri la cartella col pulsante qui sotto, collegato al tuo account Google (anche un Gmail personale).</li><li>Clic destro sulla cartella › <b>Organizza › Aggiungi scorciatoia</b> › <b>Il mio Drive</b>.</li><li>Installa <a href=\"https://www.google.com/drive/download/\" target=\"_blank\" rel=\"noopener\">Google Drive per desktop</a>: la cartella compare in «Il mio Drive».</li><li>Per averla sul disco anche senza internet: clic destro › <b>Disponibile offline</b> (o modalità <b>Mirroring</b>). Si aggiorna da sola; non occupa spazio del tuo account Google, solo del disco. La cartella è in sola lettura.</li>",
  "<li>Open the folder with the button below, signed in to your Google account (a personal Gmail is fine).</li><li>Right-click the folder › <b>Organize › Add shortcut</b> › <b>My Drive</b>.</li><li>Install <a href=\"https://www.google.com/drive/download/\" target=\"_blank\" rel=\"noopener\">Google Drive for desktop</a>: the folder appears in «My Drive».</li><li>To keep it on disk for offline use: right-click › <b>Available offline</b> (or <b>Mirror</b> mode). It updates by itself; it uses disk space, not your Google storage. The folder is read-only.</li>",
  "<li>Ouvrez le dossier avec le bouton ci-dessous, connecté à votre compte Google (un Gmail personnel suffit).</li><li>Clic droit sur le dossier › <b>Organiser › Ajouter un raccourci</b> › <b>Mon Drive</b>.</li><li>Installez <a href=\"https://www.google.com/drive/download/\" target=\"_blank\" rel=\"noopener\">Google Drive pour ordinateur</a> : le dossier apparaît dans «Mon Drive».</li><li>Pour le garder sur le disque hors ligne : clic droit › <b>Disponible hors connexion</b> (ou mode <b>Mise en miroir</b>). Il se met à jour tout seul ; il occupe le disque, pas votre stockage Google. Le dossier est en lecture seule.</li>",
  "<li>Öffne den Ordner mit der Schaltfläche unten, angemeldet mit deinem Google-Konto (ein privates Gmail genügt).</li><li>Rechtsklick auf den Ordner › <b>Organisieren › Verknüpfung hinzufügen</b> › <b>Meine Ablage</b>.</li><li>Installiere <a href=\"https://www.google.com/drive/download/\" target=\"_blank\" rel=\"noopener\">Google Drive für den Desktop</a>: der Ordner erscheint in «Meine Ablage».</li><li>Um ihn offline auf der Festplatte zu haben: Rechtsklick › <b>Offline verfügbar</b> (oder Modus <b>Spiegeln</b>). Er aktualisiert sich selbst; er belegt die Festplatte, nicht deinen Google-Speicher. Der Ordner ist schreibgeschützt.</li>",
  "<li>Abre la carpeta con el botón de abajo, con tu cuenta de Google (vale un Gmail personal).</li><li>Clic derecho en la carpeta › <b>Organizar › Añadir acceso directo</b> › <b>Mi unidad</b>.</li><li>Instala <a href=\"https://www.google.com/drive/download/\" target=\"_blank\" rel=\"noopener\">Google Drive para ordenador</a>: la carpeta aparece en «Mi unidad».</li><li>Para tenerla en el disco sin internet: clic derecho › <b>Disponible sin conexión</b> (o modo <b>Duplicar</b>). Se actualiza sola; ocupa disco, no tu almacenamiento de Google. La carpeta es de solo lectura.</li>"],
 loc_spazio: ["Attenzione allo spazio: la cartella completa occupa diverse centinaia di GB. Una regione con carta tecnica, terreno e mappe Garmin può superare i 30-40 GB: controlla lo spazio libero prima di scaricare.",

 loc_no: ["La copia completa delle mappe sul computer, per lavorare senza internet, è riservata agli operatori di enti e organizzazioni di soccorso riconosciuti (volontariato di protezione civile iscritto, CNSAS, Vigili del Fuoco, Croce Rossa, forze dell'ordine, enti pubblici). Se ne fai parte, chiedi l'abilitazione indicando il tuo gruppo e un referente.",

          "La copie complète des cartes sur l'ordinateur, pour travailler hors ligne, est réservée aux membres d'organismes de secours reconnus (bénévoles de protection civile enregistrés, secours en montagne, pompiers, Croix-Rouge, forces de l'ordre, organismes publics). Si c'est votre cas, demandez l'accès en indiquant votre groupe et un référent.",
          "Die vollständige Kopie der Karten auf dem Computer, für die Arbeit offline, ist Mitgliedern anerkannter Rettungsorganisationen vorbehalten (eingetragene Zivilschutz-Freiwillige, Bergrettung, Feuerwehr, Rotes Kreuz, Polizei, öffentliche Stellen). Wenn du dazugehörst, beantrage die Freigabe mit Angabe deiner Gruppe und einer Kontaktperson.",
          "La copia completa de los mapas en el ordenador, para trabajar sin internet, está reservada a miembros de organizaciones de rescate reconocidas (voluntariado de protección civil inscrito, rescate de montaña, bomberos, Cruz Roja, fuerzas del orden, entes públicos). Si es tu caso, solicita la habilitación indicando tu grupo y una persona de referencia."],

let LINGUA = (() => { try { const v = localStorage.getItem("lingua_mappe"); if (v && IDX(v) >= 0 && LINGUE.some(x => x[0] === v)) return v; } catch (e) {}
  const n = (navigator.language || "it").slice(0, 2); return LINGUE.some(x => x[0] === n) ? n : "it"; })();
const t = k => { const r = T[k]; return r ? (r[IDX(LINGUA)] || r[0]) : k; };
function traduci() {
  document.documentElement.lang = LINGUA;
  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = t(e.dataset.t); });
  document.querySelectorAll("[data-pdf]").forEach(e => { e.href = e.dataset.pdf + "_" + LINGUA + ".pdf"; });
  const s = $("r-ente"), v = s.value;
  s.innerHTML = '<option value="" disabled selected>–</option>' + ENTI.map(k => '<option value="' + k + '">' + t("e_" + k) + "</option>").join("");
  if (v) s.value = v;
  aggiornaBadge();
}

// ---------------------------------------------------------------- supporto
const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const QUI = location.origin + location.pathname;
// ?torna=/Carica_Mappe/... : dopo il login si torna alla pagina di lavoro da cui si e' arrivati (accesso.js)
const TORNA = (() => { const v = new URLSearchParams(location.search).get("torna") || "";
  return /^\/[A-Za-z0-9_]/.test(v) && !v.startsWith("//") && !v.startsWith("/TopoRescue") ? v : ""; })();
const DICHIARAZIONE = "2026-11-17";   // 17 nov: versione della dichiarazione (uguale in accesso.js e accesso_app.py)
let STATO = null, RECUPERO = /type=recovery/.test(location.hash);   // link "password dimenticata" della mail

function mostra(v) {
  ["login", "registra", "recupero", "nuovapw", "menu", "attesa", "dichiarazione"].forEach(x => { $("v-" + x).hidden = x !== v; });
  if (v !== "menu") window.scrollTo(0, 0);
}
function avvisa(testo, errore) { const m = $("msg"); m.textContent = testo || ""; m.hidden = !testo; m.classList.toggle("err", !!errore); }
function errore(e) {
  const s = String((e && (e.message || e.error_description)) || e || "");
  if (/invalid login credentials/i.test(s)) return t("m_credenziali");
  if (/email not confirmed/i.test(s)) return t("m_non_confermata");
  if (/link is invalid|has expired|otp_expired|token has expired/i.test(s)) return t("m_scaduto");
  if (/rate limit|too many|429/i.test(s)) return t("m_troppe");
  return t("m_errore") + s;
}
async function occupato(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { avvisa(errore(e), true); } finally { btn.disabled = false; }
}
function sistema() {
  const u = navigator.userAgent;
  return (/Windows/.test(u) ? "Windows" : /iPhone|iPad/.test(u) ? "iOS" : /Mac/.test(u) ? "Mac" : /Android/.test(u) ? "Android" : /Linux/.test(u) ? "Linux" : "altro") + " / browser";
}

// ---------------------------------------------------------------- dopo il login
async function entrato(sessione) {
  mostra("attesa");
  const { data, error } = await sb.rpc("mio_stato");
  if (error) { avvisa(errore(error), true); mostra("login"); return; }
  STATO = (data && data[0]) || { autorizzato: false, bloccato: false, nome: "" };
  if (STATO.bloccato) { await sb.auth.signOut(); avvisa(t("m_bloccato"), true); mostra("login"); return; }
  // 17 nov: dichiarazione di responsabilita' da accettare (una volta, poi a ogni nuova versione)
  if ("dichiarazione" in STATO && STATO.dichiarazione !== DICHIARAZIONE) {
    $("b-dich-leggi").href = "https://claudemonbaron.github.io/Carica_Mappe/istruzioni_" + LINGUA + ".pdf";
    $("c-dich").checked = false; $("c-dich").disabled = true; $("b-dich").disabled = true; $("dich-prima").hidden = false;
    $("b-dich-leggi").onclick = () => { $("c-dich").disabled = false; $("dich-prima").hidden = true; };
    $("c-dich").onchange = () => { $("b-dich").disabled = !$("c-dich").checked; };
    $("b-dich").onclick = () => occupato($("b-dich"), async () => {
      const r = await sb.rpc("accetta_dichiarazione", { versione: DICHIARAZIONE });
      if (r.error) throw r.error;
      await entrato(sessione);
    });
    $("b-dich-esci").onclick = async () => { await sb.auth.signOut(); mostra("login"); };
    mostra("dichiarazione"); return;
  }
  try { await sb.from("accessi").insert({ app: "ingresso", versione: VERSIONE, sistema: sistema() }); } catch (e) {}
  const u = sessione.user, md = u.user_metadata || {};
  $("m-nome").textContent = [STATO.nome || md.nome, md.cognome].filter(Boolean).join(" ") || u.email;
  $("loc-si").hidden = !STATO.autorizzato; $("loc-no").hidden = !!STATO.autorizzato;
  const corpo = "Nome: " + (md.nome || "") + "\nCognome: " + (md.cognome || "") + "\nEmail: " + u.email +
    "\nEnte: " + t("e_" + (md.ente_tipo || "privato")) + "\nGruppo / sezione: " + (md.ente_nome || "") +
    "\n\nReferente del gruppo (nome e telefono o email):\n\nMotivo della richiesta:\n";
  $("b-richiedi").href = "mailto:" + MAIL + "?subject=" + encodeURIComponent("Richiesta abilitazione copia locale – " + u.email) + "&body=" + encodeURIComponent(corpo);
  aggiornaBadge();
  if (TORNA) { location.replace(TORNA); return; }
  const so = /Windows/.test(navigator.userAgent) ? "win" : /Mac/.test(navigator.userAgent) ? "mac" : null;
  if (so) scegliSO(so);
  mostra("menu");
}
function aggiornaBadge() {
  const b = $("m-badge"); if (!b || !STATO) return;
  b.textContent = STATO.autorizzato ? t("abilitato") : t("base"); b.classList.toggle("ok", !!STATO.autorizzato);
}

// ---------------------------------------------------------------- programmi dal Drive
let SO = null;
function scegliSO(s) {
  SO = s;
  document.querySelectorAll("#so [data-so]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.so === s)));
  $("ist-mac").hidden = s !== "mac" && s !== "macintel"; $("ist-win").hidden = s !== "win";
  $("b-scarica").disabled = false;
}
let PERM = null;
async function permesso(forza) {
  if (!forza && PERM && PERM.scade * 1000 - Date.now() > 300000) return PERM;
  const r = await sb.functions.invoke("permesso-drive", { method: "POST", body: {} });
  if (r.error || !r.data || !r.data.token) throw new Error("permesso " + ((r.data && r.data.errore) || (r.error && r.error.message) || ""));
  PERM = r.data; return PERM;
}
async function elencoDrive(id) {
  const q = new URLSearchParams({ q: "'" + id + "' in parents and trashed=false", pageSize: "1000",
    fields: "files(id,name,size)", supportsAllDrives: "true", includeItemsFromAllDrives: "true" });
  const r = await fetch("https://www.googleapis.com/drive/v3/files?" + q, { cache: "no-store", headers: { Authorization: "Bearer " + (await permesso()).token } });
  if (!r.ok) throw new Error("Drive " + r.status);
  return (await r.json()).files || [];
}
// 1.2: i programmi si scaricano dalla pagina (Drive API con la chiave, come Carica Mappe) e si salvano col loro
// nome. Il collegamento diretto di Drive mostrava per i .dmg/.exe la pagina "Google Drive non puo' eseguire la
// scansione antivirus", che sostituiva questa pagina e fermava il secondo scaricamento.
function statoScarica(testo, err) { const m = $("scarica-stato"); m.innerHTML = testo || ""; m.hidden = !testo; m.classList.toggle("err", !!err); }
async function scaricaFile(f, n, tot) {
  const urls = ["https://www.googleapis.com/download/drive/v3/files/" + f.id + "?alt=media",
                "https://www.googleapis.com/drive/v3/files/" + f.id + "?alt=media"];
  let r = null, errore = null;
  const aut = { Authorization: "Bearer " + (await permesso()).token };
  for (const u of urls) {
    try { r = await fetch(u, { headers: aut }); if (r.ok) break; errore = new Error("Drive " + r.status); r = null; } catch (e) { errore = e; r = null; }
  }
  if (!r) throw errore || new Error("Drive");
  const tutto = +f.size || +r.headers.get("content-length") || 0, pezzi = [];
  let letti = 0;
  const rd = r.body.getReader();
  for (;;) {
    const { done, value } = await rd.read();
    if (done) break;
    pezzi.push(value); letti += value.length;
    statoScarica(t("m_scarico_in") + " <b>" + f.name.replace(/^_+/, "") + "</b> (" + n + "/" + tot + "): " +
                 Math.round(letti / 1048576) + (tutto ? " / " + Math.round(tutto / 1048576) : "") + " MB");
  }
  const url = URL.createObjectURL(new Blob(pezzi, { type: "application/octet-stream" }));
  const a = document.createElement("a");
  a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
async function scaricaApp() {
  const est = SO === "mac" ? ".dmg" : SO === "macintel" ? "_Intel.dmg" : ".exe";   // 1.6: Mac Intel -> ____..._Intel.dmg
  const voluti = [$("a-estr").checked && APP.estr, $("a-car").checked && APP.car].filter(Boolean).map(n => n + est);
  if (!voluti.length) return;
  statoScarica(t("attendi"));
  let files;
  try {
    const cart = (await elencoDrive((await permesso()).radice)).find(f => f.name === "Estrazione_mappe");
    if (!cart) throw new Error("Estrazione_mappe");
    files = await elencoDrive(cart.id);
  } catch (e) { statoScarica(t("m_drive") + e.message, true); return; }
  const trovati = voluti.map(nome => files.find(x => x.name === nome)).filter(Boolean);
  if (!trovati.length) { statoScarica(t("m_drive") + voluti.join(", "), true); return; }
  try {
    for (let i = 0; i < trovati.length; i++) await scaricaFile(trovati[i], i + 1, trovati.length);
  } catch (e) { statoScarica(t("m_drive") + e.message, true); return; }
  try { await sb.from("accessi").insert({ app: "scarica_" + SO, versione: VERSIONE, sistema: sistema() }); } catch (e) {}
  statoScarica(t("m_scarico") + " " + trovati.map(f => f.name).join(", "));
}

// ---------------------------------------------------------------- moduli
document.querySelectorAll("[data-vai]").forEach(b => b.addEventListener("click", () => { avvisa(""); mostra(b.dataset.vai); }));
document.querySelectorAll("#so [data-so]").forEach(b => b.addEventListener("click", () => scegliSO(b.dataset.so)));
$("b-scarica").addEventListener("click", e => occupato(e.currentTarget, scaricaApp));

$("f-login").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    $("b-rimanda").hidden = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pw").value });
    if (error) { if (/not confirmed/i.test(error.message)) $("b-rimanda").hidden = false; throw error; }
    avvisa(""); $("l-pw").value = ""; await entrato(data.session);
  }); });
$("b-rimanda").addEventListener("click", e => occupato(e.currentTarget, async () => {
  const { error } = await sb.auth.resend({ type: "signup", email: $("l-email").value.trim(), options: { emailRedirectTo: QUI } });
  if (error) throw error; avvisa(t("m_rimandata"));
}));

$("f-reg").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    if ($("r-pw").value !== $("r-pw2").value) { avvisa(t("m_pw_diverse"), true); return; }
    const email = $("r-email").value.trim();
    const { error } = await sb.auth.signUp({ email, password: $("r-pw").value, options: { emailRedirectTo: QUI,
      data: { nome: $("r-nome").value.trim(), cognome: $("r-cognome").value.trim(), ente_tipo: $("r-ente").value,
              ente_nome: $("r-gruppo").value.trim(), consenso: $("r-consenso").checked ? "si" : "no", lingua: LINGUA } } });
    if (error) throw error;
    $("f-reg").reset(); $("l-email").value = email; mostra("login"); avvisa(t("m_reg_ok"));
  }); });

$("f-rec").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    const { error } = await sb.auth.resetPasswordForEmail($("p-email").value.trim(), { redirectTo: QUI });
    if (error) throw error; mostra("login"); avvisa(t("m_rec_ok"));
  }); });

$("f-npw").addEventListener("submit", e => { e.preventDefault(); const b = e.submitter || e.target.querySelector("button[type=submit]");
  occupato(b, async () => {
    if ($("n-pw").value !== $("n-pw2").value) { avvisa(t("m_pw_diverse"), true); return; }
    const { error } = await sb.auth.updateUser({ password: $("n-pw").value });
    if (error) throw error;
    RECUPERO = false; $("f-npw").reset(); avvisa(t("m_npw_ok"));
    const { data } = await sb.auth.getSession(); if (data.session) await entrato(data.session); else mostra("login");
  }); });

$("b-esci").addEventListener("click", async () => { await sb.auth.signOut(); STATO = null; avvisa(""); mostra("login"); });

// ---------------------------------------------------------------- avvio
(function lingua() {
  const s = $("lingua");
  s.innerHTML = LINGUE.map(([k, n]) => '<option value="' + k + '">' + n + "</option>").join("");
  s.value = LINGUA;
  s.addEventListener("change", () => { LINGUA = s.value; try { localStorage.setItem("lingua_mappe", LINGUA); } catch (e) {} traduci(); });
})();
traduci();
// errore nel link della mail (scaduto o gia' usato): Supabase lo mette nell'indirizzo
(function erroreLink() {
  const h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (h.get("error_description")) { avvisa(errore(h.get("error_description").replace(/\+/g, " ")) + " " + t("m_link"), true); history.replaceState(null, "", QUI); }
})();
sb.auth.onAuthStateChange((evento, sessione) => {
  if (evento === "PASSWORD_RECOVERY") { RECUPERO = true; mostra("nuovapw"); }
});
// Link delle mail con ?token_hash=...&type=email|recovery (modelli delle mail di Supabase): la verifica la fa la
// pagina aperta da una persona. I controlli automatici dei servizi di posta, che aprono il link per vedere se e'
// pericoloso, scaricano solo la pagina e non consumano il link (col link diretto di Supabase si', "link scaduto").
async function verificaLink() {
  const q = new URLSearchParams(location.search);
  const th = q.get("token_hash"), tipo = q.get("type");
  if (!th || !tipo) return false;
  history.replaceState(null, "", QUI);
  const { data, error } = await sb.auth.verifyOtp({ token_hash: th, type: tipo });
  if (error) { avvisa(errore(error) + " " + t("m_link"), true); mostra("login"); return true; }
  if (tipo === "recovery") { RECUPERO = true; mostra("nuovapw"); return true; }
  if (data.session) await entrato(data.session); else mostra("login");
  return true;
}
verificaLink().then(fatto => {
  if (fatto) return;
  sb.auth.getSession().then(({ data }) => {
    if (RECUPERO) { mostra("nuovapw"); return; }
    if (data.session) entrato(data.session); else mostra("login");
  });
}).catch(e => { avvisa(errore(e), true); mostra("login"); });
</script>
